name: Release

# Push a tag like v0.1.0 to build signed per-ABI APKs and open a draft
# GitHub release with SHA-256 checksums. Needs these repository secrets
# (see docs/RELEASING.md): RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APKs
        env:
          GRABLINE_KEYSTORE: ${{ runner.temp }}/release.jks
          GRABLINE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          GRABLINE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          GRABLINE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Collect APKs and checksums
        run: |
          mkdir dist
          tag="${GITHUB_REF_NAME}"
          for f in app/build/outputs/apk/release/*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/GrabLine-${tag}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "GrabLine for Android ${GITHUB_REF_NAME#v}" --notes-file "$notes"
